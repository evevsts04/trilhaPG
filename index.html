      // --- ABA 4: CADERNO DE ERROS ---
      viewErros() {
        const errQs = questionBankCache.filter((q) => (state.errors || []).includes(q.id));
        return `
          <div class="space-y-4 animate-fade-in">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="font-black text-lg">📕 Caderno de Erros (${errQs.length})</h2>
                <p class="text-xs text-slate-500">Acerte as questões abaixo no treino de erros para removê-las automaticamente.</p>
              </div>
              <button onclick="Player.openQueue('errors', questionBankCache.filter(q => state.errors.includes(q.id)), '📕 Treino do Caderno de Erros')" class="px-4 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black ${errQs.length ? '' : 'opacity-40'}" ${errQs.length ? '' : 'disabled'}>▶ Treinar Erros</button>
            </div>

            ${errQs.length === 0 ? '<div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 text-center text-xs font-bold text-emerald-600">✅ Caderno de erros limpo!</div>' : `
              <div class="space-y-2.5">
                ${errQs.map((q) => `
                  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-rose-200 dark:border-rose-900/50 p-4 text-xs space-y-1.5">
                    <div class="flex justify-between font-black text-rose-600 dark:text-rose-400">
                      <span>${escHtml(getDiscipline(q.disciplineId).short)} • ${escHtml(q.topicoRef || q.trailTitle)}</span>
                      <button onclick="state.errors=state.errors.filter(i=>i!=='${q.id}'); persistState(true); App.render();" class="text-slate-400 hover:text-rose-600">Remover</button>
                    </div>
                    <p class="font-bold text-slate-800 dark:text-slate-200">${escHtml(q.enunciado)}</p>
                    <p class="text-slate-500">${q.dicaBanca ? '💡 ' + escHtml(q.dicaBanca) : ''}</p>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      },

      // --- ABA 5: AJUSTES ---
      viewAjustes() {
        const gKey = localStorage.getItem(LS_KEYS.GEMINI_KEY) || '';
        const fbRaw = localStorage.getItem(LS_KEYS.FB_CFG) || '';
        const usingCodeCfg = isValidFirebaseConfig(DEFAULT_FIREBASE_CONFIG);

        return `
          <div class="space-y-4 animate-fade-in">
            <div class="responsive-grid-2 grid grid-cols-1 lg:grid-cols-2 gap-4">
              <!-- SRS Prioritário + Simulador -->
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                <h3 class="font-black text-sm">⭐ Revisão Inteligente (SRS Espaçado)</h3>
                <label class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-orange-50 dark:bg-orange-950/30 border border-orange-200 dark:border-orange-900/50 cursor-pointer">
                  <span class="text-xs font-bold">Encurtar ciclo SRS para trilhas marcadas com ⭐ Foco (1d / 2d / 4d, teto 14d)</span>
                  <input type="checkbox" ${state.settings.prioritizeFocusTopics ? 'checked' : ''} onchange="state.settings.prioritizeFocusTopics=this.checked; persistState(true); showToast('Preferência salva!','success');" class="w-4 h-4 accent-orange-500 shrink-0" />
                </label>

                <div class="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-2">
                  <p class="text-xs font-extrabold">⏱️ Simulador de Data SRS (Hoje simulado: ${todayISO(0)})</p>
                  <div class="flex flex-wrap gap-2">
                    <button onclick="App.shiftSimDay(1)" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">+1 dia</button>
                    <button onclick="App.shiftSimDay(3)" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">+3 dias</button>
                    <button onclick="App.shiftSimDay(7)" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">+7 dias</button>
                    <button onclick="App.shiftSimDay(0, true)" class="px-3 py-1.5 rounded-xl bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-xs font-extrabold">Resetar</button>
                  </div>
                </div>
              </div>

              <!-- API Gemini -->
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-3">
                <h3 class="font-black text-sm">✨ Chave API Gemini (Especialista Banca IBAM)</h3>
                <p class="text-xs text-slate-500">Salva apenas no seu navegador para gerar até 5 questões de múltipla escolha por trilha.</p>
                <div class="flex gap-2">
                  <input id="cfg-gemini-key" type="password" value="${escHtml(gKey)}" placeholder="AIzaSy..." class="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono" />
                  <button onclick="localStorage.setItem(LS_KEYS.GEMINI_KEY, document.getElementById('cfg-gemini-key').value.trim()); showToast('Chave Gemini salva!', 'success');" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Salvar</button>
                </div>
              </div>

              <!-- Firebase -->
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-black text-sm">☁️ Firebase (Auth + Firestore Fragmentado)</h3>
                  <button onclick="CloudSync.pushAll(true)" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-[11px] font-extrabold">🔄 Sincronizar</button>
                </div>
                ${usingCodeCfg
                  ? '<p class="text-xs font-bold text-emerald-600">✅ Chaves carregadas diretamente do código (coleções ibam_dados / ibam_trilhas).</p>'
                  : `
                    <textarea id="cfg-fb-json" rows="4" placeholder='{"apiKey":"...","authDomain":"...","projectId":"..."}' class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px] font-mono">${escHtml(fbRaw)}</textarea>
                    <button onclick="App.saveFirebaseJson()" class="px-4 py-2 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-extrabold">Salvar JSON e Conectar</button>
                  `}
              </div>

              <!-- Backup + Aparência -->
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-3">
                <h3 class="font-black text-sm">💾 Backup JSON &amp; Tela</h3>
                <div class="flex flex-wrap gap-2">
                  <button onclick="App.exportBackup()" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">⬇️ Exportar Backup (.json)</button>
                  <label class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold cursor-pointer">
                    ⬆️ Importar Backup
                    <input type="file" accept=".json" class="hidden" onchange="App.importBackup(this.files[0])" />
                  </label>
                </div>
                <div class="flex items-center gap-2 pt-2">
                  <span class="text-xs font-bold text-slate-500">Modo de Tela:</span>
                  <select onchange="App.setViewportMode(this.value)" class="js-viewport-select px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                    <option value="auto">Automático</option>
                    <option value="desktop">PC (Desktop)</option>
                    <option value="mobile">Celular</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Zona de Perigo -->
            <div class="bg-rose-50 dark:bg-rose-950/20 rounded-3xl border border-rose-200 dark:border-rose-900 p-5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="font-black text-sm text-rose-700 dark:text-rose-400">⚠️ Zona de Perigo</h3>
                <p class="text-xs text-rose-600/80 dark:text-rose-300/80">Elimina todas as trilhas (inclusive exemplos), Banco de Questões, SRS, XP e dados na nuvem deste app.</p>
              </div>
              <button onclick="App.openWipeModal()" class="px-4 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black">🗑️ Limpar Tudo (Começar do Zero)</button>
            </div>
          </div>
        `;
      },

      shiftSimDay(delta, reset = false) {
        state.settings.simDayOffset = reset ? 0 : (state.settings.simDayOffset || 0) + delta;
        persistState(false);
        this.render();
      },

      saveFirebaseJson() {
        try {
          const parsed = JSON.parse(document.getElementById('cfg-fb-json').value.trim());
          if (!isValidFirebaseConfig(parsed)) throw new Error('JSON precisa conter apiKey, authDomain e projectId válidos.');
          localStorage.setItem(LS_KEYS.FB_CFG, JSON.stringify(parsed));
          initFirebase();
          showToast('Firebase configurado! Clique em Entrar.', 'success');
          this.render();
        } catch (e) {
          showToast('JSON inválido: ' + e.message, 'error');
        }
      },

      exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `estudei_ibam_backup_${todayISO(0)}.json`;
        a.click();
        showToast('Backup exportado!', 'success');
      },

      async importBackup(file) {
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!Array.isArray(data.trails)) throw new Error('Arquivo de backup inválido.');
          state = { ...createEmptyState(false), ...data };
          persistState(true);
          showToast(`Backup restaurado (${state.trails.length} trilhas)!`, 'success');
          this.render();
        } catch (e) {
          showToast('Erro ao importar backup: ' + e.message, 'error');
        }
      },

      openWipeModal() {
        Modal.open(`
          <div class="space-y-4">
            <h3 class="font-black text-lg text-rose-600">🗑️ Limpar Tudo</h3>
            <p class="text-xs text-slate-500">Esta ação apaga todas as trilhas, progresso, SRS, erros e matérias personalizadas no dispositivo e no Firebase. Digite <strong>ZERAR</strong> para confirmar:</p>
            <input id="wipe-confirm-input" placeholder="Digite ZERAR" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-rose-300 text-xs font-black uppercase" />
            <div class="flex gap-2">
              <button onclick="App.executeWipe()" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black">Confirmar Limpeza</button>
              <button onclick="Modal.close()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Cancelar</button>
            </div>
          </div>
        `);
      },

      async executeWipe() {
        if ((document.getElementById('wipe-confirm-input')?.value || '').trim().toUpperCase() !== 'ZERAR') {
          showToast('Digite ZERAR exatamente para confirmar.', 'warn');
          return;
        }
        state = createEmptyState(false);
        await LocalDB.clear();
        await LocalDB.set('app_state', state);
        rebuildQuestionBank();
        if (CloudSync.isSignedIn()) await CloudSync.wipeCloud();
        Modal.close();
        this.selectedDiscId = null;
        showToast('Aplicativo zerado com sucesso!', 'success');
        this.render();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
