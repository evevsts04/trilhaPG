    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);

      if (!q) return false;
      const t = (state.trails || []).find((x) => x.id === q.trailId);

    function rebuildQuestionBank() {
      const list = [];
      (state.trails || []).forEach((t) => {
        (t.questions || []).forEach((q) => {
          list.push({
            ...q,
            trailId: t.id,
            trailTitle: t.title,

          });
        });
      });

    // =========================================================================
    // 4. INDEXEDDB LOCAL (SEM LIMITE DE 5MB DO LOCALSTORAGE)
    // =========================================================================
    const LocalDB = {
      dbName: 'EstudeiIBAM_DB',
      storeName: 'kv',
      _db: null,
      open() {
        if (this._db) return Promise.resolve(this._db);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(this.storeName)) {
              req.result.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = () => { this._db = req.result; resolve(this._db); };
          req.onerror = () => reject(req.error);
        });
      },
      async get(key) {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
          });
        } catch (e) { return null; }
      },
      async set(key, val) {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put(val, key);
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) { console.error('IndexedDB set error:', e); return false; }
      },
      async clear() {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).clear();
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) { return false; }
      }
    };

    async function loadLocalState() {
      const saved = await LocalDB.get('app_state');
      if (saved && typeof saved === 'object') {
        const base = createEmptyState(!saved.seedDeleted);
        state = {
          ...base,
          ...saved,
          stats: { ...base.stats, ...(saved.stats || {}) },
          settings: { ...base.settings, ...(saved.settings || {}) }
        };
      } else {
        state = createEmptyState(true);
      }
      rebuildQuestionBank();
    }

    let saveTimer = null;
    function persistState(syncCloud = true) {
      state.updatedAt = Date.now();
      rebuildQuestionBank();
      LocalDB.set('app_state', state);
      if (syncCloud && CloudSync.isSignedIn()) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => CloudSync.pushAll(false), 1200);
      }
    }

    // =========================================================================
    // 5. FIREBASE AUTH + CLOUD FIRESTORE FRAGMENTADO (1 DOC POR TRILHA)
    // =========================================================================
    let fbAuth = null;
    let fbDb = null;
    let currentUser = null;

    function isValidFirebaseConfig(cfg) {
      if (!cfg || typeof cfg !== 'object') return false;
      return ['apiKey', 'authDomain', 'projectId'].every((k) => {
        const v = String(cfg[k] || '').trim();
        return v.length > 5 && !v.includes('COLE_') && !v.includes('SEU_PROJETO') && !v.includes('SUA_');
      });
    }

    function getActiveFirebaseConfig() {
      if (isValidFirebaseConfig(DEFAULT_FIREBASE_CONFIG)) return DEFAULT_FIREBASE_CONFIG;
      try {
        const saved = JSON.parse(localStorage.getItem(LS_KEYS.FB_CFG) || 'null');
        if (isValidFirebaseConfig(saved)) return saved;
        if (saved) localStorage.removeItem(LS_KEYS.FB_CFG);
      } catch (e) {
        localStorage.removeItem(LS_KEYS.FB_CFG);
      }
      return null;
    }

    function initFirebase() {
      const cfg = getActiveFirebaseConfig();
      if (!cfg || typeof firebase === 'undefined') return false;
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
        fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        fbAuth.onAuthStateChanged(async (user) => {
          currentUser = user;
          updateAuthBadges();
          if (user) {
            await CloudSync.pullAll();
          }
        });
        return true;
      } catch (e) {
        console.error('Erro ao inicializar Firebase:', e);
        return false;
      }
    }

    function setSyncLabel(txt) {
      document.querySelectorAll('.js-sync-status').forEach((el) => (el.textContent = txt));
    }

    function updateAuthBadges() {
      const label = currentUser ? `☁️ ${currentUser.email || currentUser.displayName || 'Conectado'}` : '👤 Modo Local';
      const short = currentUser ? `☁️ ${(currentUser.displayName || currentUser.email || 'Conta').split('@')[0]}` : '👤 Entrar';
      document.querySelectorAll('.js-auth-label').forEach((el) => (el.textContent = label));
      document.querySelectorAll('.js-auth-short').forEach((el) => (el.textContent = short));
      if (!currentUser) setSyncLabel('💾 IndexedDB local');
    }

    const CloudSync = {
      isSignedIn() { return !!(fbDb && currentUser); },

      // Coleção isolada 'ibam_dados' e 'ibam_trilhas' no usuário para não colidir com outros apps
      async pushAll(showFeedback = true) {
        if (!this.isSignedIn()) {
          if (showFeedback) showToast('Faça login para sincronizar na nuvem.', 'warn');
          return false;
        }
        try {
          setSyncLabel('⏳ Sincronizando...');
          const userRef = fbDb.collection('users').doc(currentUser.uid);
          const dadosRef = userRef.collection('ibam_dados');
          const trilhasCol = userRef.collection('ibam_trilhas');

          await Promise.all([
            dadosRef.doc('meta').set({
              customDisciplines: state.customDisciplines || [],
              seedDeleted: !!state.seedDeleted,
              settings: state.settings || {},
              updatedAt: state.updatedAt || Date.now()
            }),
            dadosRef.doc('resultados').set({
              progress: state.progress || {},
              srs: state.srs || {},
              errors: state.errors || [],
              stats: state.stats || {},
              updatedAt: state.updatedAt || Date.now()
            })
          ]);

          const existingSnap = await trilhasCol.get();
          const currentIds = new Set((state.trails || []).map((t) => t.id));
          const ops = [];

          existingSnap.forEach((doc) => {
            if (!currentIds.has(doc.id)) ops.push({ type: 'delete', ref: doc.ref });
          });
          (state.trails || []).forEach((t) => {
            ops.push({ type: 'set', ref: trilhasCol.doc(t.id), data: t });
          });

          for (let i = 0; i < ops.length; i += 400) {
            const batch = fbDb.batch();
            ops.slice(i, i + 400).forEach((op) => {
              if (op.type === 'delete') batch.delete(op.ref);
              else batch.set(op.ref, op.data);
            });
            await batch.commit();
          }

          setSyncLabel('✅ Nuvem atualizada');
          if (showFeedback) showToast('Sincronizado com o Firebase (1 doc/trilha)!', 'success');
          return true;
        } catch (e) {
          console.error('Erro CloudSync.pushAll:', e);
          setSyncLabel('⚠️ Erro na nuvem');
          if (showFeedback) showToast(`Erro ao sincronizar: ${e.message || e.code}`, 'error');
          return false;
        }
      },

      async pullAll() {
        if (!this.isSignedIn()) return;
        try {
          setSyncLabel('⏳ Baixando nuvem...');
          const userRef = fbDb.collection('users').doc(currentUser.uid);
          const [metaSnap, resSnap, trilhasSnap] = await Promise.all([
            userRef.collection('ibam_dados').doc('meta').get(),
            userRef.collection('ibam_dados').doc('resultados').get(),
            userRef.collection('ibam_trilhas').get()
          ]);

          if (!metaSnap.exists && trilhasSnap.empty) {
            await this.pushAll(false);
            return;
          }

          const cloudTrails = [];
          trilhasSnap.forEach((d) => cloudTrails.push(d.data()));

          const meta = metaSnap.exists ? metaSnap.data() : {};
          const res = resSnap.exists ? resSnap.data() : {};
          const cloudUpdated = Math.max(meta.updatedAt || 0, res.updatedAt || 0);

          if (cloudUpdated >= (state.updatedAt || 0) || cloudTrails.length > 0) {
            state.trails = cloudTrails.sort((a, b) => (a.order || 0) - (b.order || 0));
            if (Array.isArray(meta.customDisciplines)) state.customDisciplines = meta.customDisciplines;
            if (typeof meta.seedDeleted === 'boolean') state.seedDeleted = meta.seedDeleted;
            if (meta.settings) state.settings = { ...state.settings, ...meta.settings };
            if (res.progress) state.progress = res.progress;
            if (res.srs) state.srs = res.srs;
            if (Array.isArray(res.errors)) state.errors = res.errors;
            if (res.stats) state.stats = { ...state.stats, ...res.stats };
            state.updatedAt = cloudUpdated || Date.now();
            await LocalDB.set('app_state', state);
            rebuildQuestionBank();
          }

          setSyncLabel('✅ Nuvem conectada');
          App.render();
        } catch (e) {
          console.error('Erro CloudSync.pullAll:', e);
          setSyncLabel('⚠️ Falha ao baixar');
        }
      },

      async wipeCloud() {
        if (!this.isSignedIn()) return;
        const userRef = fbDb.collection('users').doc(currentUser.uid);
        const snap = await userRef.collection('ibam_trilhas').get();
        const docs = snap.docs;
        for (let i = 0; i < docs.length; i += 400) {
          const batch = fbDb.batch();
          docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
        await userRef.collection('ibam_dados').doc('meta').set({
          customDisciplines: [], seedDeleted: true, settings: state.settings, updatedAt: Date.now()
        });
        await userRef.collection('ibam_dados').doc('resultados').set({
          progress: {}, srs: {}, errors: [], stats: state.stats, updatedAt: Date.now()
        });
      }
    };

    // =========================================================================
    // 7. MOTOR TEÓRICO IBAM (MARCAÇÃO DE PONTOS-CHAVE + MÚLTIPLA ESCOLHA)
    // =========================================================================
    const IBAMTheoryEngine = {
      applyOfflineMarks(text) {
        let html = escHtml(text);
        // 1. Exceções / Restrições / Negações
        html = html.replace(/\b(salvo|exceto|vedado|vedada|vedados|vedadas|proibido|proibida|somente|apenas|não ocorre|não se aplica|ressalvado|ressalvada|independentemente|nunca|jamais|obrigatório|obrigatória)\b/gi,
          '<span class="v-exc">$1</span>');
        // 2. Prazos / Números / Quóruns / Dados quantitativos
        html = html.replace(/\b(\d+(?:[\.,]\d+)?\s*(?:dias?\s*úteis|dias?\s*corridos|dias?|horas?|meses|mês|anos?|%|por cento|fases?|estádios?|situações?|casos?)|\d+\/\d+|facultativo|facultativa)\b/gi,
          '<span class="v-prazo">$1</span>');
        // 3. Órgãos / Sujeitos / Competências / Agentes
        html = html.replace(/\b(Administração Pública|servidor(?:es)? públicos?|União|Estados|Municípios|Prefeito|Secretário|Agente de Combate às Endemias|Agente Administrativo|fêmea|macho|SUS|Ministério da Saúde|Poder Executivo|Poder Legislativo|Poder Judiciário)\b/gi,
          '<span class="v-comp">$1</span>');
        // 4. Conceitos / Classificações nucleares
        html = html.replace(/\b(crase|regência|concordância|holometábolo|hematofagia|arboviroses|Dengue|Zika|Chikungunya|Febre Amarela|princípio da legalidade|impessoalidade|moralidade|publicidade|eficiência|ato administrativo|presunção de legitimidade|autoexecutoriedade|imperatividade)\b/gi,
          '<span class="v-conc">$1</span>');
        return html;
      },

      // Gerador offline de até 5 questões de múltipla escolha a partir dos subtópicos da apostila
      generateOfflineQuestions(trail) {
        const sections = trail.sections || [];
        if (!sections.length) return [];

        const statements = [];
        sections.forEach((sec) => {
          const sentences = String(sec.rawText || '')
            .split(/(?<=[.!?])\s+|\n+/)
            .map((s) => s.replace(/\s+/g, ' ').trim())
            .filter((s) => s.length >= 45 && s.length <= 260 && !s.endsWith(':'));

          sentences.forEach((s) => {
            statements.push({ subtitulo: sec.subtitulo, text: s });
          });
        });

        if (statements.length < 2) return [];

        const makeDistortedFalse = (sentence) => {
          const swaps = [
            [/\bnão\s+/i, ''],
            [/\bsomente\b/gi, 'indistintamente'],
            [/\bapenas\b/gi, 'obrigatoriamente'],
            [/\bfacultativo\b/gi, 'proibido'],
            [/\bfacultativa\b/gi, 'proibida'],
            [/\bobrigatório\b/gi, 'facultativo'],
            [/\bobrigatória\b/gi, 'facultativa'],
            [/\bdiurnos?\b/gi, 'exclusivamente noturnos'],
            [/\bfêmea\b/gi, 'macho'],
            [/\b(\d+)\b/, (_, n) => String(Number(n) + 15)]
          ];
          for (const [rx, rep] of swaps) {
            if (rx.test(sentence)) {
              return sentence.replace(rx, rep);
            }
          }
          return `Diferentemente do previsto na teoria, ${sentence.charAt(0).toLowerCase() + sentence.slice(1).replace(/\.$/, '')} apenas em caráter excepcional.`;
        };

        const qs = [];
        const usedIndexes = new Set();
        const maxQ = Math.min(5, statements.length);

        for (let i = 0; i < maxQ; i++) {
          let idx = i % statements.length;
          if (usedIndexes.has(idx)) continue;
          usedIndexes.add(idx);

          const target = statements[idx];
          const distractors = [];

          // 1 distrator baseado na inversão da própria afirmação
          distractors.push(makeDistortedFalse(target.text));

          // Mais 2 distratores invertendo outras frases da apostila
          for (let j = 1; j < statements.length && distractors.length < 3; j++) {
            const other = statements[(idx + j) % statements.length];
            const distorted = makeDistortedFalse(other.text);
            if (!distractors.includes(distorted) && distorted !== target.text) {
              distractors.push(distorted);
            }
          }

          while (distractors.length < 3) {
            distractors.push(`Nenhuma das disposições teóricas anteriores aplica-se ao tema ${target.subtitulo}.`);
          }

          const allOptions = [target.text, ...distractors.slice(0, 3)];
          // Embaralha mantendo rastreio da correta
          const indexed = allOptions.map((txt, pos) => ({ txt, isCorrect: pos === 0 })).sort(() => Math.random() - 0.5);
          const correctIndex = indexed.findIndex((x) => x.isCorrect);

          qs.push({
            id: uid(`${trail.id}_q`),
            tipo: 'multiple_choice',
            topicoRef: target.subtitulo,
            enunciado: `Com base no estudo teórico sobre "${target.subtitulo}", assinale a alternativa CORRETA:`,
            opcoes: indexed.map((x) => x.txt),
            respostaCorreta: correctIndex,
            fundamentacao: target.text,
            dicaBanca: 'Questão gerada no modo offline. Use "✨ Gerar com IA IBAM" para questões inéditas comentadas.'
          });
        }

        return qs.slice(0, 5);
      },

      async callGemini(prompt) {
        const key = (localStorage.getItem(LS_KEYS.GEMINI_KEY) || '').trim();
        if (!key) throw new Error('Chave da API Gemini não configurada.');
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0.35 }
          })
        });
        if (!resp.ok) {
          const errTxt = await resp.text();
          throw new Error(`Gemini HTTP ${resp.status}: ${errTxt.slice(0, 120)}`);
        }
        const data = await resp.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = raw.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
        return JSON.parse(cleaned);
      },

      async upgradeTrailWithAI(trail, extraOnly = false) {
        const theoryText = (trail.sections || [])
          .map((s) => `SUBTÍTULO: ${s.subtitulo}\n${s.rawText}`)
          .join('\n\n');
        const existingList = (trail.questions || []).map((q) => q.enunciado).join(' | ');

        const ibamPromptRules = `Atue como um especialista em concursos públicos da banca IBAM (Instituto Brasileiro de Administração Municipal).
Crie questões de MÚLTIPLA ESCOLHA (exclusivamente 4 alternativas: índices 0, 1, 2 e 3) sobre os assuntos da respectiva trilha teórica abaixo.
Regras obrigatórias:
1. Gere NO MÁXIMO 5 questões (entre 3 e 5 questões, proporcionais ao tamanho do conteúdo).
2. NUNCA crie questões de lacunas (Cloze) nem Certo/Errado — APENAS múltipla escolha ("tipo": "multiple_choice") com 4 alternativas plausíveis.
3. Estilo IBAM: enunciados diretos, claros, objetivos e estritamente fiéis ao conteúdo teórico fornecido (sem cobrar assuntos externos ao texto).
4. Use distratores típicos da IBAM: inversão de conceitos, troca de prazos/números, generalizações indevidas ("sempre", "nunca", "apenas") e troca de competências.
5. Para cada questão, forneça "fundamentacao" (explicação clara baseada na apostila) e "dicaBanca" (bizu objetivo de prova da IBAM).`;

        const prompt = extraOnly
          ? `${ibamPromptRules}

Crie até 5 NOVAS questões inéditas de múltipla escolha da banca IBAM sobre o assunto desta trilha (não repita estas: ${existingList.slice(0, 600)}).
Retorne APENAS JSON válido:
{"questions":[{"tipo":"multiple_choice","topicoRef":"Nome do subtópico","enunciado":"...","opcoes":["Alternativa A","Alternativa B","Alternativa C","Alternativa D"],"respostaCorreta":0,"fundamentacao":"...","dicaBanca":"..."}]}

CONTEÚDO TEÓRICO DA TRILHA (${trail.title}):
${theoryText}`
          : `Atue como um especialista na preparação para concursos da banca IBAM.
Receba os subtópicos teóricos da apostila abaixo e devolva um JSON com duas chaves:
1) "sections": MESMO texto teórico integral de cada subtópico (sem cortar conteúdo), aplicando marcação cirúrgica com spans:
- <span class="v-exc">...</span> para EXCEÇÕES / RESTRIÇÕES / PROIBIÇÕES
- <span class="v-prazo">...</span> para PRAZOS / NÚMEROS / CLASSIFICAÇÕES QUANTITATIVAS
- <span class="v-comp">...</span> para ÓRGÃOS / SUJEITOS / COMPETÊNCIAS
- <span class="v-conc">...</span> para CONCEITOS NUCLEARES / DEFINIÇÕES
   E "notaBanca" curta iniciada por "⚠️ Dica IBAM:" (ou "" se não houver).

2) "questions": até 5 questões de múltipla escolha seguindo rigorosamente estas instruções:
${ibamPromptRules}

Retorne APENAS JSON válido:
{"sections":[{"subtitulo":"...","textoHtml":"...","notaBanca":"⚠️ Dica IBAM: ..."}],"questions":[{"tipo":"multiple_choice","topicoRef":"...","enunciado":"...","opcoes":["Alternativa A","Alternativa B","Alternativa C","Alternativa D"],"respostaCorreta":0,"fundamentacao":"...","dicaBanca":"..."}]}

CONTEÚDO TEÓRICO DA TRILHA (${trail.title}):
${theoryText}`;

        const res = await this.callGemini(prompt);
        if (!extraOnly && Array.isArray(res.sections)) {
          trail.sections.forEach((orig, idx) => {
            const match = res.sections.find((s) => s.subtitulo?.trim().toLowerCase() === orig.subtitulo?.trim().toLowerCase()) || res.sections[idx];
            if (match?.textoHtml) orig.textoHtml = match.textoHtml;
            if (typeof match?.notaBanca === 'string') orig.notaBanca = match.notaBanca;
          });
          trail.origemIa = true;
        }
        if (Array.isArray(res.questions) && res.questions.length) {
          const formatted = res.questions
            .filter((q) => Array.isArray(q.opcoes) && q.opcoes.length >= 2)
            .slice(0, 5)
            .map((q) => ({
              ...q,
              tipo: 'multiple_choice',
              respostaCorreta: Number(q.respostaCorreta) || 0,
              id: uid(`${trail.id}_q`)
            }));
          if (extraOnly) trail.questions = [...(trail.questions || []), ...formatted];
          else trail.questions = formatted;
        }
        return trail;
      }
    };

    // =========================================================================
    // 8. PARSER HIERÁRQUICO DE APOSTILA TEÓRICA (TÍTULO E SUBTÍTULOS)
    // =========================================================================
    const ApostilaParser = {
      parse(rawText, disciplineId, splitLargeTopics = true) {
        const lines = String(rawText || '')
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .split('\n')
          .map((l) => l.trim())
          .filter((l) => l.length > 0);

        // Padrões de Título Principal (Módulo, Unidade, Capítulo, Parte, Título ou numeração de 1º nível "1. Título")
        const majorRx = /^(?:M[ÓO]DULO|UNIDADE|CAP[ÍI]TULO|PARTE|T[ÍI]TULO|TEMA)\b\s*.*$/i;
        const level1NumRx = /^(\d+)\.\s+([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^\n]{2,110})$/;
        // Padrões de Subtítulo (1.1 Subtítulo, 1.1.2 Subtítulo, Tópico X, ou cabeçalho curto sem ponto final)
        const subNumRx = /^(\d+(?:\.\d+)+)\.?\s+([^\n]{2,120})$/;
        const topicLabelRx = /^(?:T[ÓO]PICO|SUBT[ÍI]TULO|ITEM)\b\s*.*$/i;

        const isAllCapsHeading = (line) => {
          if (line.length < 4 || line.length > 100) return false;
          if (/[.;!?]$/.test(line)) return false;
          const letters = line.replace(/[^A-Za-zÁÉÍÓÚÂÊÔÃÕÇáéíóúâêôãõç]/g, '');
          return letters.length >= 4 && letters === letters.toUpperCase();
        };

        let currentMainTitle = 'Conteúdo Geral da Apostila';
        const topics = []; // Cada tópico vira uma trilha organizada sob currentMainTitle
        let currentTopic = null;
        let currentSubSection = null;

        const ensureTopic = (title) => {
          if (!currentTopic) {
            currentTopic = {
              mainTitle: currentMainTitle,
              title: title || currentMainTitle,
              sections: []
            };
            topics.push(currentTopic);
          }
        };

        const ensureSubSection = (subTitle) => {
          ensureTopic(subTitle || currentMainTitle);
          if (!currentSubSection) {
            currentSubSection = {
              subtitulo: subTitle || currentTopic.title,
              lines: [],
              notaBanca: ''
            };
            currentTopic.sections.push(currentSubSection);
          }
        };

        const flushSubSection = () => {
          if (!currentSubSection) return;
          currentSubSection.rawText = currentSubSection.lines.join('\n').trim();
          currentSubSection.textoHtml = IBAMTheoryEngine.applyOfflineMarks(currentSubSection.rawText);
          delete currentSubSection.lines;
          if (!currentSubSection.rawText && currentTopic) {
            currentTopic.sections = currentTopic.sections.filter((s) => s !== currentSubSection);
          }
          currentSubSection = null;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          // 1. Título Principal (MÓDULO, CAPÍTULO, UNIDADE, "1. TÍTULO", ou CAIXA ALTA)
          if (majorRx.test(line) || level1NumRx.test(line) || isAllCapsHeading(line)) {
            flushSubSection();
            currentMainTitle = line.replace(/\s+/g, ' ').trim();
            currentTopic = {
              mainTitle: currentMainTitle,
              title: currentMainTitle,
              sections: []
            };
            topics.push(currentTopic);
            continue;
          }

          // 2. Subtítulo (1.1 ..., 2.3.1 ..., Tópico ...)
          if (subNumRx.test(line) || topicLabelRx.test(line)) {
            flushSubSection();
            const cleanSub = line.replace(/\s+/g, ' ').trim();
            // Se o tópico atual ainda não tem conteúdo ou é nível 1.1, cria trilha dedicada para este subtítulo
            const isLevel2 = /^\d+\.\d+(?!\.\d)/.test(cleanSub) || topicLabelRx.test(cleanSub);
            if (isLevel2 || !currentTopic) {
              currentTopic = {
                mainTitle: currentMainTitle,
                title: cleanSub,
                sections: []
              };
              topics.push(currentTopic);
            }
            currentSubSection = {
              subtitulo: cleanSub,
              lines: [],
              notaBanca: ''
            };
            currentTopic.sections.push(currentSubSection);
            continue;
          }

          // 3. Parágrafo ou item de lista pertencente ao subtítulo/título atual
          ensureSubSection(currentTopic ? currentTopic.title : currentMainTitle);
          currentSubSection.lines.push(line);
        }
        flushSubSection();

        const validTopics = topics.filter((t) => t.sections.length > 0);
        const existingCount = (state.trails || []).filter((t) => t.disciplineId === disciplineId).length;
        const trails = [];
        let totalSubtopics = 0;

        validTopics.forEach((topic) => {
          totalSubtopics += topic.sections.length;

          // Se ativado, divide tópicos muito longos (mais de 4 subtópicos ou > 3.500 caracteres) em partes digeríveis
          const chunks = [];
          if (!splitLargeTopics) {
            chunks.push(topic.sections);
          } else {
            let curChunk = [];
            let curChars = 0;
            topic.sections.forEach((sec) => {
              const secLen = (sec.rawText || '').length;
              if (curChunk.length > 0 && (curChunk.length >= 4 || curChars + secLen > 3500)) {
                chunks.push(curChunk);
                curChunk = [];
                curChars = 0;
              }
              curChunk.push(sec);
              curChars += secLen;
            });
            if (curChunk.length > 0) chunks.push(curChunk);
          }

          chunks.forEach((chunk, pIdx) => {
            const partSuffix = chunks.length > 1 ? ` (Parte ${pIdx + 1}/${chunks.length})` : '';
            const totalWords = chunk.reduce((acc, s) => acc + (s.rawText || '').split(/\s+/).length, 0);
            const estMin = Math.min(15, Math.max(4, Math.ceil(totalWords / 160)));
            const subLabel = chunk.length === 1 ? '1 subtópico' : `${chunk.length} subtópicos`;

            trails.push({
              id: uid(`tr_${disciplineId}`),
              disciplineId,
              order: existingCount + trails.length + 1,
              breadcrumb: topic.mainTitle,
              title: `${topic.title}${partSuffix}`,
              subtitle: `${subLabel} • ~${totalWords} palavras`,
              readingMin: estMin,
              origemIa: false,
              isHighPriority: false,
              selected: true,
              sections: chunk,
              questions: []
            });
          });
        });

        const mappedSubtopics = trails.reduce((sum, t) => sum + t.sections.length, 0);
        return { totalSubtopics, mappedSubtopics, trails };
      }
    };

    // =========================================================================
    // 9. MOTOR DE REVISÃO ESPAÇADA (SRS)
    // =========================================================================
    const SRSEngine = {
      getIntervals(isPriority) {
        if (isPriority && state.settings.prioritizeFocusTopics) {
          return { hard: 1, good: 2, easy: 4, max: 14 };
        }
        return { hard: 1, good: 3, easy: 7, max: 60 };
      },

      enqueueTrail(trail) {
        if (!trail || !Array.isArray(trail.questions)) return;
        const tomorrow = todayISO(1);
        trail.questions.forEach((q) => {
          if (!state.srs[q.id]) {
            state.srs[q.id] = { due: tomorrow, interval: 1, ease: 2.5, reps: 0 };
          }
        });
      },

      schedule(questionId, rating, trailId = '') {
        const t = (state.trails || []).find((x) => x.id === trailId);
        const isPrio = isPriorityTrail(t);
        const iv = this.getIntervals(isPrio);
        const cur = state.srs[questionId] || { due: todayISO(0), interval: 0, ease: 2.5, reps: 0 };

        let nextDays = 0;
        let reps = cur.reps || 0;
        let ease = cur.ease || 2.5;

        if (rating === 'again') {
          nextDays = 0;
          reps = 0;
          ease = Math.max(1.3, ease - 0.2);
        } else if (rating === 'hard') {
          nextDays = Math.min(iv.max, Math.max(iv.hard, Math.round((cur.interval || iv.hard) * 1.2)));
          reps++;
          ease = Math.max(1.3, ease - 0.1);
        } else if (rating === 'good') {
          nextDays = reps === 0 ? iv.good : Math.min(iv.max, Math.max(iv.good, Math.round((cur.interval || iv.good) * ease)));
          reps++;
        } else {
          nextDays = reps === 0 ? iv.easy : Math.min(iv.max, Math.max(iv.easy, Math.round((cur.interval || iv.easy) * ease * 1.3)));
          reps++;
          ease = Math.min(3.0, ease + 0.1);
        }

        state.srs[questionId] = {
          due: todayISO(nextDays),
          interval: nextDays,
          ease: Number(ease.toFixed(2)),
          reps
        };
        persistState(true);
      },

      getDueQuestions(onlyPriority = false) {
        const today = todayISO(0);
        const due = questionBankCache.filter((q) => {
          const rec = state.srs[q.id];
          if (!rec || rec.due > today) return false;
          if (onlyPriority && !isPriorityQuestion(q)) return false;
          return true;
        });

        if (state.settings.prioritizeFocusTopics) {
          due.sort((a, b) => {
            const pDiff = (isPriorityQuestion(b) ? 1 : 0) - (isPriorityQuestion(a) ? 1 : 0);
            if (pDiff !== 0) return pDiff;
            return (state.srs[a.id]?.due || '').localeCompare(state.srs[b.id]?.due || '');
          });
        }
        return due;
      }
    };

    // =========================================================================
    // 10. PLAYER DE ESTUDO (FASE 1 LEITURA DA APOSTILA / FASE 2 QUIZ IBAM)
    // =========================================================================
    const Player = {
      mode: 'read',
      trail: null,
      questions: [],
      qIndex: 0,
      hits: 0,
      answered: false,
      title: '',
      timerSec: 300,
      timerRunning: false,
      timerHandle: null,

      openTrailRead(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        this.stopTimer();
        this.mode = 'read';
        this.trail = t;
        this.title = t.title;
        this.timerSec = (t.readingMin || 5) * 60;
        this.timerRunning = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderRead();
      },

      openTrailQuiz(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        if (!t.questions || !t.questions.length) {
          t.questions = IBAMTheoryEngine.generateOfflineQuestions(t);
          persistState(true);
        }
        if (!t.questions.length) {
          showToast('Use "✨ Gerar Questões IBAM" para criar as questões desta trilha.', 'warn');
          return;
        }
        this.stopTimer();
        this.mode = 'trail_quiz';
        this.trail = t;
        this.title = `Quiz IBAM — ${t.title}`;
        this.questions = t.questions.slice(0, 5).map((q) => ({ ...q, trailId: t.id, disciplineId: t.disciplineId }));
        this.qIndex = 0;
        this.hits = 0;
        this.answered = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderQuestion();
      },

      openQueue(mode, list, title) {
        if (!list || !list.length) {
          showToast('Nenhuma questão disponível nesta fila.', 'warn');
          return;
        }
        this.stopTimer();
        this.mode = mode;
        this.trail = null;
        this.title = title;
        this.questions = list;
        this.qIndex = 0;
        this.hits = 0;
        this.answered = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderQuestion();
      },

      close() {
        this.stopTimer();
        document.getElementById('player-overlay').classList.add('hidden');
        App.render();
      },

      stopTimer() {
        if (this.timerHandle) clearInterval(this.timerHandle);
        this.timerHandle = null;
        this.timerRunning = false;
      },

      toggleTimer() {
        if (this.timerRunning) {
          this.stopTimer();
        } else {
          this.timerRunning = true;
          this.timerHandle = setInterval(() => {
            if (this.timerSec > 0) this.timerSec--;
            else {
              this.stopTimer();
              showToast('⏱️ Tempo de leitura concluído! Vamos para as questões IBAM.', 'info');
            }
            this.updateTimerUI();
          }, 1000);
        }
        this.updateTimerUI();
      },

      formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      },

      updateTimerUI() {
        const btn = document.getElementById('read-timer-btn');
        if (btn) btn.textContent = `${this.timerRunning ? '⏸️' : '▶️'} ${this.formatTime(this.timerSec)}`;
      },

      toggleMarks() {
        state.settings.showMarks = !state.settings.showMarks;
        persistState(true);
        if (this.mode === 'read') this.renderRead();
      },

      changeFontSize(delta) {
        state.settings.fontSize = Math.min(24, Math.max(13, (state.settings.fontSize || 16) + delta));
        persistState(true);
        if (this.mode === 'read') this.renderRead();
      },

      formatParagraphs(htmlText) {
        return String(htmlText || '')
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const plain = line.replace(/<[^>]+>/g, '').trim();
            if (/^([•\-–*]|\d+\)|[a-z]\))\s+/i.test(plain)) {
              return `<p class="pl-4 mb-2">${line}</p>`;
            }
            return `<p class="mb-2.5">${line}</p>`;
          })
          .join('');
      },

      renderRead() {
        const t = this.trail;
        if (!t) return;
        const d = getDiscipline(t.disciplineId);
        const hideMarksCls = state.settings.showMarks ? '' : 'hide-marks';
        const fontSize = state.settings.fontSize || 16;
        const qCount = Math.min(5, (t.questions || []).length);

        document.getElementById('player-header-info').innerHTML = `
          <p class="text-[10px] font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400 truncate">${escHtml(d.short)} • ${escHtml(t.breadcrumb || '')}</p>
          <h2 class="font-black text-sm sm:text-base truncate">Fase 1: ${escHtml(t.title)}</h2>
        `;

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-3xl mx-auto space-y-4 animate-fade-in ${hideMarksCls}">
            <!-- Barra de controles da leitura -->
            <div class="sticky top-0 z-10 bg-white/95 dark:bg-slate-900/95 backdrop-blur border border-slate-200 dark:border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2 shadow-sm">
              <div class="flex flex-wrap items-center gap-1.5">
                <button id="read-timer-btn" onclick="Player.toggleTimer()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-black">${this.timerRunning ? '⏸️' : '▶️'} ${this.formatTime(this.timerSec)}</button>
                <button onclick="Player.toggleMarks()" class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${state.settings.showMarks ? 'bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">🖍️ Destaques Teóricos</button>
                <button onclick="Player.changeFontSize(-1)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">A-</button>
                <button onclick="Player.changeFontSize(1)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">A+</button>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="App.toggleTrailPriority('${t.id}')" class="px-2.5 py-1.5 rounded-xl text-xs font-extrabold ${t.isHighPriority ? 'bg-orange-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}" title="Marcar como tópico prioritário no SRS">⭐ Foco</button>
                <button onclick="App.promptUpgradeAI('${t.id}', false)" class="px-3 py-1.5 rounded-xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-xs font-extrabold">✨ IA IBAM (5q)</button>
              </div>
            </div>

            <!-- Legenda 4 cores -->
            <div class="ibam-legend bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 flex flex-wrap items-center gap-2 text-[11px] font-bold">
              <span class="text-slate-400 font-extrabold mr-1">Radar IBAM:</span>
              <span class="px-2 py-0.5 rounded bg-rose-200/80 text-rose-900 dark:bg-rose-900/50 dark:text-rose-200">Exceção / Proibição</span>
              <span class="px-2 py-0.5 rounded bg-yellow-200/80 text-yellow-900 dark:bg-yellow-900/50 dark:text-yellow-200">Prazo / Número / Dado</span>
              <span class="px-2 py-0.5 rounded bg-blue-200/80 text-blue-900 dark:bg-blue-900/50 dark:text-blue-200">Órgão / Sujeito</span>
              <span class="px-2 py-0.5 rounded bg-purple-200/80 text-purple-900 dark:bg-purple-900/50 dark:text-purple-200">Conceito / Definição</span>
            </div>

            <!-- Cartões dos Subtópicos da Apostila -->
            <div class="space-y-4">
              ${(t.sections || []).map((sec, idx) => `
                <article class="bg-white dark:bg-slate-900 rounded-3xl border ${t.isHighPriority ? 'border-orange-300 dark:border-orange-800/80' : 'border-slate-200 dark:border-slate-800'} p-5 shadow-sm space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="px-3 py-1 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 text-xs font-black">${escHtml(sec.subtitulo || `Tópico ${idx + 1}`)}</span>
                    ${t.isHighPriority ? '<span class="px-2.5 py-1 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-300 text-[10px] font-black">⭐ Tópico Prioritário</span>' : ''}
                  </div>
                  <div class="theory-text leading-relaxed text-slate-800 dark:text-slate-200" style="font-size:${fontSize}px">
                    ${this.formatParagraphs(sec.textoHtml || IBAMTheoryEngine.applyOfflineMarks(sec.rawText))}
                  </div>
                  ${sec.notaBanca ? `<div class="pegadinha-note p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 text-xs font-semibold text-amber-900 dark:text-amber-200">${escHtml(sec.notaBanca)}</div>` : ''}
                </article>
              `).join('')}
            </div>

            <button onclick="Player.openTrailQuiz('${t.id}')" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-lg transition">
              🎯 Ir para Fase 2: Quiz Banca IBAM (${qCount} ${qCount === 1 ? 'questão' : 'questões'} de múltipla escolha) →
            </button>
          </div>
        `;
      },

      renderQuestion() {
        if (this.qIndex >= this.questions.length) {
          this.renderSummary();
          return;
        }
        this.answered = false;
        const q = this.questions[this.qIndex];
        const total = this.questions.length;
        const pct = Math.round((this.qIndex / total) * 100);
        const d = getDiscipline(q.disciplineId);
        const isPrio = isPriorityQuestion(q);

        document.getElementById('player-header-info').innerHTML = `
          <p class="text-[10px] font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400 truncate">${escHtml(this.title)}</p>
          <h2 class="font-black text-sm sm:text-base truncate">Questão ${this.qIndex + 1} de ${total}</h2>
        `;

        const optionsHtml = `
          <div class="space-y-2.5">
            ${(q.opcoes || []).map((opt, idx) => `
              <button onclick="Player.answer(${idx})" data-opt-idx="${idx}" class="q-opt w-full text-left p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 bg-white dark:bg-slate-900 text-xs sm:text-sm font-bold transition flex items-start gap-2.5">
                <span class="inline-flex w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 items-center justify-center shrink-0 text-[11px] font-black">${String.fromCharCode(65 + idx)}</span>
                <span>${escHtml(opt)}</span>
              </button>
            `).join('')}
          </div>
        `;

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-2xl mx-auto space-y-4 animate-fade-in">
            <div class="h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 transition-all" style="width:${pct}%"></div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-[11px] font-extrabold">${escHtml(d.short)} • ${escHtml(q.topicoRef || 'Tópico da Trilha')}</span>
                  ${isPrio ? '<span class="px-2.5 py-1 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-300 text-[10px] font-black">⭐ Prioritário</span>' : ''}
                </div>
                <span class="text-[11px] font-extrabold text-indigo-600 dark:text-indigo-400">📝 Múltipla Escolha • Banca IBAM</span>
              </div>

              <p class="text-sm sm:text-base font-bold leading-relaxed">${escHtml(q.enunciado)}</p>
              ${optionsHtml}
            </div>

            <div id="q-feedback"></div>
          </div>
        `;
      },

      answer(choiceIdx) {
        if (this.answered) return;
        this.answered = true;
        const q = this.questions[this.qIndex];
        const correctIdx = Number(q.respostaCorreta);
        const correct = Number(choiceIdx) === correctIdx;

        if (correct) {
          this.hits++;
          this.addXP(10);
          if (this.mode === 'errors') {
            state.errors = state.errors.filter((id) => id !== q.id);
          }
        } else {
          if (!state.errors.includes(q.id)) state.errors.push(q.id);
        }
        persistState(true);

        document.querySelectorAll('.q-opt').forEach((b) => {
          b.disabled = true;
          const idx = Number(b.dataset.optIdx);
          if (idx === correctIdx) {
            b.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40');
          } else if (idx === Number(choiceIdx) && !correct) {
            b.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40', 'opacity-80');
          } else {
            b.classList.add('opacity-50');
          }
        });

        const isPrio = isPriorityQuestion(q);
        const iv = SRSEngine.getIntervals(isPrio);
        const correctLetter = String.fromCharCode(65 + correctIdx);

        const srsBar = this.mode === 'srs' ? `
          <div class="pt-3 border-t border-slate-200 dark:border-slate-800">
            <p class="text-[11px] font-extrabold text-slate-500 mb-2">Agendar próxima revisão ${isPrio && state.settings.prioritizeFocusTopics ? '(⭐ Ciclo Curto — Prioritário)' : '(Ciclo Padrão)'}:</p>
            <div class="grid grid-cols-4 gap-2">
              <button onclick="Player.rateSRS('again')" class="py-2 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 text-xs font-black">Errei<br><span class="text-[10px] font-semibold">Hoje</span></button>
              <button onclick="Player.rateSRS('hard')" class="py-2 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 text-xs font-black">Difícil<br><span class="text-[10px] font-semibold">${iv.hard}d</span></button>
              <button onclick="Player.rateSRS('good')" class="py-2 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 text-xs font-black">Bom<br><span class="text-[10px] font-semibold">${iv.good}d</span></button>
              <button onclick="Player.rateSRS('easy')" class="py-2 rounded-xl bg-sky-100 dark:bg-sky-950/60 text-sky-800 dark:text-sky-300 text-xs font-black">Fácil<br><span class="text-[10px] font-semibold">${iv.easy}d</span></button>
            </div>
          </div>
        ` : `
          <button onclick="Player.next()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-black text-sm">Continuar →</button>
        `;

        document.getElementById('q-feedback').innerHTML = `
          <div class="rounded-3xl border p-5 space-y-3 animate-fade-in ${correct ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800'}">
            <p class="font-black text-sm ${correct ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
              ${correct ? `✅ Resposta Correta — Letra ${correctLetter}! (+10 XP)` : `❌ Gabarito: Letra ${correctLetter} (Enviada ao Caderno de Erros)`}
            </p>
            ${q.fundamentacao ? `
              <div class="text-xs sm:text-sm bg-white/90 dark:bg-slate-900/90 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 leading-relaxed">
                <span class="font-black text-indigo-600 dark:text-indigo-400 block mb-1">📖 Fundamentação na Apostila:</span>
                ${escHtml(q.fundamentacao)}
              </div>
            ` : ''}
            ${q.dicaBanca ? `<p class="text-xs font-bold text-amber-800 dark:text-amber-300">💡 Bizu Banca IBAM: ${escHtml(q.dicaBanca)}</p>` : ''}
            ${srsBar}
          </div>
        `;
      },

      rateSRS(rating) {
        const q = this.questions[this.qIndex];
        SRSEngine.schedule(q.id, rating, q.trailId);
        this.next();
      },

      next() {
        this.qIndex++;
        this.renderQuestion();
      },

      addXP(amount) {
        const today = todayISO(0);
        state.stats.xp = (state.stats.xp || 0) + amount;
        if (state.stats.todayDate !== today) {
          state.stats.todayDate = today;
          state.stats.todayCount = 0;
        }
        state.stats.todayCount++;
        if (state.stats.lastStudyDate !== today) {
          const yesterday = todayISO(-1);
          state.stats.streak = state.stats.lastStudyDate === yesterday ? (state.stats.streak || 0) + 1 : 1;
          state.stats.lastStudyDate = today;
        }
      },

      renderSummary() {
        const total = this.questions.length;
        const pct = total ? Math.round((this.hits / total) * 100) : 0;
        let masteredNow = false;

        if (this.mode === 'trail_quiz' && this.trail?.id) {
          const prev = state.progress[this.trail.id] || { mastered: false, bestScore: 0 };
          const mastered = prev.mastered || pct === 100;
          masteredNow = pct === 100;
          state.progress[this.trail.id] = { mastered, bestScore: Math.max(prev.bestScore || 0, pct), updatedAt: todayISO(0) };
          if (masteredNow) {
            this.addXP(50);
            SRSEngine.enqueueTrail(this.trail);
          }
          persistState(true);
        }

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-md mx-auto text-center bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 space-y-4 shadow-sm animate-fade-in">
            <div class="text-5xl">${pct === 100 ? '🏆' : pct >= 70 ? '💪' : '📚'}</div>
            <h2 class="font-black text-2xl">${pct}% de Acerto</h2>
            <p class="text-xs font-bold text-slate-500">${this.hits} de ${total} questões corretas</p>
            ${this.mode === 'trail_quiz' ? (
              masteredNow
                ? '<div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold">✅ Trilha 100% Dominada! Próxima etapa desbloqueada e questões enviadas para a fila SRS (+50 XP).</div>'
                : '<div class="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 text-xs font-extrabold">🔒 Regra de Ouro: acerte 100% das questões para destravar o próximo tópico.</div>'
            ) : ''}
            <div class="flex flex-col gap-2 pt-2">
              ${this.mode === 'trail_quiz' && !masteredNow ? `<button onclick="Player.openTrailQuiz('${this.trail.id}')" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-black">🔄 Tentar Novamente</button>` : ''}
              ${this.mode === 'trail_quiz' ? `<button onclick="App.promptUpgradeAI('${this.trail.id}', false)" class="w-full py-2.5 rounded-2xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-xs font-extrabold">✨ Gerar Novas Questões IBAM (até 5q)</button>` : ''}
              <button onclick="Player.close()" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">Voltar ao Painel</button>
            </div>
          </div>
        `;
      }
    };

    // =========================================================================
    // 11. CONTROLADOR PRINCIPAL (5 ABAS)
    // =========================================================================
    const App = {
      tab: 'trilhas',
      selectedDiscId: null,
      revSubTab: 'due',
      bankFilterDisc: 'all',
      bankOnlyPriority: false,
      importDraft: null,
      importDestDisc: 'portugues',
      importSplitLarge: true,

      async init() {
        if (localStorage.getItem(LS_KEYS.THEME) === 'dark') document.documentElement.classList.add('dark');
        this.setViewportMode(localStorage.getItem(LS_KEYS.VIEWPORT) || 'auto', false);

        await loadLocalState();
        initFirebase();
        updateAuthBadges();
        this.render();
      },

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(LS_KEYS.THEME, isDark ? 'dark' : 'light');
      },

      setViewportMode(mode, save = true) {
        document.body.classList.remove('force-mobile', 'force-desktop');
        if (mode === 'mobile') document.body.classList.add('force-mobile');
        if (mode === 'desktop') document.body.classList.add('force-desktop');
        if (save) localStorage.setItem(LS_KEYS.VIEWPORT, mode);
        document.querySelectorAll('.js-viewport-select').forEach((el) => (el.value = mode));
      },

      setTab(tab) {
        this.tab = tab;
        this.render();
      },

      toggleTrailPriority(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        t.isHighPriority = !t.isHighPriority;
        persistState(true);
        showToast(t.isHighPriority ? '⭐ Trilha marcada como Prioritária (revisão curta).' : 'Prioridade removida.', 'info');
        if (!document.getElementById('player-overlay').classList.contains('hidden') && Player.mode === 'read') Player.renderRead();
        else this.render();
      },

      updateTopMetrics() {
        document.querySelectorAll('.js-streak').forEach((el) => (el.textContent = state.stats.streak || 0));
        document.querySelectorAll('.js-xp').forEach((el) => (el.textContent = state.stats.xp || 0));
        const dueCount = SRSEngine.getDueQuestions(false).length;
        document.querySelectorAll('.js-due-badge').forEach((el) => {
          el.textContent = dueCount;
          el.classList.toggle('hidden', dueCount === 0);
        });
        const errCount = (state.errors || []).length;
        document.querySelectorAll('.js-err-badge').forEach((el) => {
          el.textContent = errCount;
          el.classList.toggle('hidden', errCount === 0);
        });

        document.querySelectorAll('.nav-btn').forEach((b) => {
          const active = b.dataset.tab === this.tab;
          b.className = `nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-extrabold transition ${active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`;
        });
        document.querySelectorAll('.nav-btn-mob').forEach((b) => {
          const active = b.dataset.tab === this.tab;
          b.className = `nav-btn-mob relative flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-extrabold ${active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}`;
        });
      },

      render() {
        this.updateTopMetrics();
        const root = document.getElementById('view-root');
        if (this.tab === 'trilhas') root.innerHTML = this.viewTrilhas();
        else if (this.tab === 'revisoes') root.innerHTML = this.viewRevisoes();
        else if (this.tab === 'importar') { root.innerHTML = this.viewImportar(); this.bindDropzone(); }
        else if (this.tab === 'erros') root.innerHTML = this.viewErros();
        else root.innerHTML = this.viewAjustes();
      },

      // --- ABA 1: TRILHAS ---
      viewTrilhas() {
        const discs = getAllDisciplines();
        if (this.selectedDiscId) return this.viewDisciplineTrails(this.selectedDiscId);

        const totalTrails = state.trails.length;
        const mastered = state.trails.filter((t) => state.progress[t.id]?.mastered).length;
        const pct = totalTrails ? Math.round((mastered / totalTrails) * 100) : 0;

        return `
          <div class="space-y-5 animate-fade-in">
            <div class="bg-gradient-to-br from-indigo-600 to-blue-700 text-white rounded-3xl p-5 shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="text-[11px] font-bold uppercase tracking-wider text-indigo-200">Concursos Banca IBAM • Apostilas Organizadas por Títulos e Subtítulos</p>
                <h2 class="font-black text-xl sm:text-2xl mt-0.5">Suas Trilhas Teóricas</h2>
                <p class="text-xs text-indigo-100 mt-1">${mastered} de ${totalTrails} trilhas dominadas (${pct}%) • Até 5 questões de múltipla escolha por trilha</p>
              </div>
              <div class="flex gap-2">
                <button onclick="App.openNewDisciplineModal()" class="px-3.5 py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-xs font-extrabold backdrop-blur">+ Nova Matéria</button>
                <button onclick="App.setTab('importar')" class="px-4 py-2.5 rounded-2xl bg-white text-indigo-700 text-xs font-black shadow">📥 Importar Apostila</button>
              </div>
            </div>

            <div class="responsive-grid-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${discs.map((d) => {
                const list = state.trails.filter((t) => t.disciplineId === d.id);
                const done = list.filter((t) => state.progress[t.id]?.mastered).length;
                const p = list.length ? Math.round((done / list.length) * 100) : 0;
                const isCustom = (state.customDisciplines || []).some((c) => c.id === d.id);
                return `
                  <div onclick="App.openDiscipline('${d.id}')" class="cursor-pointer bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-400 p-4 transition shadow-sm flex flex-col justify-between gap-3">
                    <div class="flex items-start justify-between gap-2">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg shrink-0">${d.icon || '📘'}</span>
                        <div class="min-w-0">
                          <h3 class="font-black text-sm truncate">${escHtml(d.short)}</h3>
                          <p class="text-[11px] text-slate-400 line-clamp-1">${escHtml(d.name)}</p>
                        </div>
                      </div>
                      ${isCustom && list.length === 0 ? `<button onclick="event.stopPropagation(); App.deleteCustomDiscipline('${d.id}')" class="text-rose-500 text-xs font-bold px-1.5">🗑️</button>` : ''}
                    </div>
                    <div>
                      <div class="flex justify-between text-[11px] font-extrabold mb-1">
                        <span class="text-slate-500">${list.length} trilha${list.length === 1 ? '' : 's'}</span>
                        <span class="text-indigo-600 dark:text-indigo-400">${done}/${list.length} (${p}%)</span>
                      </div>
                      <div class="h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600" style="width:${p}%"></div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      openDiscipline(id) { this.selectedDiscId = id; this.render(); },

      viewDisciplineTrails(discId) {
        const d = getDiscipline(discId);
        const list = state.trails.filter((t) => t.disciplineId === discId).sort((a, b) => (a.order || 0) - (b.order || 0));

        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button onclick="App.selectedDiscId=null; App.render();" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-extrabold">← Todas as Matérias</button>
              <button onclick="App.importDestDisc='${discId}'; App.setTab('importar');" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">📥 Importar Apostila nesta Matéria</button>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-4 sm:p-5">
              <h2 class="font-black text-lg">${d.icon || '📘'} ${escHtml(d.short)}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${escHtml(d.name)}</p>
            </div>

            ${list.length === 0 ? `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 p-8 text-center space-y-3">
                <p class="text-sm font-bold text-slate-500">Nenhuma trilha teórica cadastrada nesta matéria ainda.</p>
                <button onclick="App.importDestDisc='${discId}'; App.setTab('importar');" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">📥 Subir apostila .docx agora</button>
              </div>
            ` : `
              <div class="responsive-grid-2 grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                ${list.map((t, idx) => {
                  const prog = state.progress[t.id] || { mastered: false, bestScore: 0 };

      startSimulado() {
        let pool = questionBankCache.filter((q) => {
          if (this.bankFilterDisc !== 'all' && q.disciplineId !== this.bankFilterDisc) return false;

          return true;

                <div class="mt-3 space-y-2">
                  <textarea id="manual-theory-text" rows="6" placeholder="1. TÍTULO DO ASSUNTO&#10;1.1 Subtítulo do Tópico&#10;Texto teórico da apostila..." class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono"></textarea>
                  <button onclick="App.parseManualText()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Organizar Títulos e Subtítulos</button>
                </div>
              </details>
            </div>

            ${draft ? `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-indigo-200 dark:border-indigo-800 p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 class="font-black text-base">🔍 Estrutura Extraída da Apostila</h3>
                    <p class="text-xs font-bold text-emerald-600 dark:text-emerald-400">
                      ✅ ${draft.mappedSubtopics}/${draft.totalSubtopics} subtópicos mapeados • ${draft.trails.length} trilha(s) prontas
                    </p>
                  </div>
                  <div class="flex gap-2">
                    <button onclick="App.commitImport(false)" class="px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-black">⚡ Gerar Offline</button>
                    <button onclick="App.commitImport(true)" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-black">✨ Gerar com IA IBAM (5q/trilha)</button>
                  </div>
                </div>
                <div id="import-progress" class="hidden text-xs font-extrabold text-indigo-600"></div>
                <div class="space-y-2 max-h-72 overflow-y-auto">
                  ${draft.trails.map((t, i) => `
                    <label class="flex items-start gap-2.5 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 cursor-pointer">
                      <input type="checkbox" ${t.selected ? 'checked' : ''} onchange="App.importDraft.trails[${i}].selected=this.checked" class="mt-1 accent-indigo-600" />
                      <div class="min-w-0 text-xs">
                        <p class="text-[10px] font-black text-indigo-600 dark:text-indigo-400">${escHtml(t.breadcrumb)}</p>
                        <p class="font-extrabold">${escHtml(t.title)}</p>
                        <p class="text-slate-500">${escHtml(t.subtitle)} • ⏱️ ${t.readingMin} min</p>
                      </div>
                    </label>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${importedList.length ? `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-3">
                <h3 class="font-black text-sm">📚 Trilhas Importadas (${importedList.length})</h3>
                <div class="space-y-2 max-h-64 overflow-y-auto">
                  ${importedList.map((t) => `
                    <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between gap-2 text-xs">
                      <div class="min-w-0">
                        <p class="font-extrabold truncate">${escHtml(getDiscipline(t.disciplineId).short)} — ${escHtml(t.title)}</p>
                        <p class="text-[11px] text-slate-400">${escHtml(t.subtitle)}</p>
                      </div>
                      <button onclick="App.deleteTrail('${t.id}')" class="px-2.5 py-1 rounded-lg bg-rose-100 dark:bg-rose-950/50 text-rose-600 text-[11px] font-extrabold shrink-0">Excluir</button>

      bindDropzone() {
        const dz = document.getElementById('docx-dropzone');
        const inp = document.getElementById('docx-input');
        if (!dz || !inp) return;
        dz.onclick = () => inp.click();
        dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('ring-2', 'ring-indigo-500'); };
        dz.ondragleave = () => dz.classList.remove('ring-2', 'ring-indigo-500');
        dz.ondrop = (e) => {
          e.preventDefault();
          dz.classList.remove('ring-2', 'ring-indigo-500');
          if (e.dataTransfer.files?.[0]) this.handleDocxFile(e.dataTransfer.files[0]);
        };
      },

      async handleDocxFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.docx')) { showToast('Selecione um arquivo .docx válido.', 'error'); return; }
        try {
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer: buf });
          this.importDraft = ApostilaParser.parse(res.value || '', this.importDestDisc, this.importSplitLarge);
          if (this.importDraft.totalSubtopics === 0) showToast('Nenhum conteúdo estruturado encontrado no documento.', 'warn');
          else showToast(`${this.importDraft.totalSubtopics} subtópicos organizados em ${this.importDraft.trails.length} trilhas!`, 'success');
          this.render();
        } catch (e) {
          showToast('Erro ao ler .docx: ' + e.message, 'error');
        }
      },

      parseManualText() {
        const txt = (document.getElementById('manual-theory-text')?.value || '').trim();
        if (!txt) { showToast('Cole o texto da apostila primeiro.', 'warn'); return; }
        this.importDraft = ApostilaParser.parse(txt, this.importDestDisc, this.importSplitLarge);
        this.render();
      },

      async commitImport(useAI) {
        if (!this.importDraft) return;
        const chosen = this.importDraft.trails.filter((t) => t.selected);
        if (!chosen.length) { showToast('Selecione ao menos uma trilha.', 'warn'); return; }

        const progEl = document.getElementById('import-progress');
        if (progEl) progEl.classList.remove('hidden');

        for (let i = 0; i < chosen.length; i++) {
          const t = { ...chosen[i] };
          delete t.selected;
          if (progEl) progEl.textContent = `⏳ Criando trilha ${i + 1} de ${chosen.length}: ${t.title}...`;

          if (useAI) {
            try {
              await IBAMTheoryEngine.upgradeTrailWithAI(t, false);
            } catch (e) {
              t.questions = IBAMTheoryEngine.generateOfflineQuestions(t);
              t.origemIa = false;
              showToast(`Fallback offline na trilha ${i + 1}: ${e.message}`, 'warn');
            }
          } else {
            t.questions = IBAMTheoryEngine.generateOfflineQuestions(t);
          }
          state.trails.push(t);
        }

        this.importDraft = null;
        persistState(true);
        showToast(`${chosen.length} trilha(s) teórica(s) adicionada(s)!`, 'success');
        this.selectedDiscId = this.importDestDisc;
        this.setTab('trilhas');
      },

      deleteTrail(trailId) {
        state.trails = state.trails.filter((t) => t.id !== trailId);
        delete state.progress[trailId];
        persistState(true);
        showToast('Trilha excluída.', 'info');
        this.render();
      },

      // --- UPGRADE COM IA IBAM (ATÉ 5 QUESTÕES DE MÚLTIPLA ESCOLHA) ---
      promptUpgradeAI(trailId, extraOnly = false) {
        const key = (localStorage.getItem(LS_KEYS.GEMINI_KEY) || '').trim();
        if (!key) {
          Modal.open(`
            <div class="space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-black text-base">✨ Chave da API Gemini</h3>
                <button onclick="Modal.close()" class="text-slate-400 font-bold">✕</button>
              </div>
              <p class="text-xs text-slate-500">Cole sua chave gratuita do Google AI Studio para a IA atuar como especialista da banca IBAM e gerar até 5 questões de múltipla escolha sobre o assunto da trilha.</p>
              <input id="quick-gemini-key" type="password" placeholder="AIzaSy..." class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono" />
              <div class="flex gap-2">
                <button onclick="App.saveQuickKeyAndRun('${trailId}', ${extraOnly})" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Salvar e Gerar Questões IBAM</button>
              </div>
            </div>
          `);
          return;
        }
        this.runUpgradeAI(trailId, extraOnly);
      },

      saveQuickKeyAndRun(trailId, extraOnly) {
        const k = (document.getElementById('quick-gemini-key')?.value || '').trim();
        if (!k) { showToast('Informe a chave.', 'warn'); return; }
        localStorage.setItem(LS_KEYS.GEMINI_KEY, k);
        Modal.close();
        this.runUpgradeAI(trailId, extraOnly);
      },

      async runUpgradeAI(trailId, extraOnly) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        showToast('✨ Especialista IBAM criando até 5 questões de múltipla escolha...', 'info');
        try {
          await IBAMTheoryEngine.upgradeTrailWithAI(t, extraOnly);
          persistState(true);
          showToast('Questões estilo IBAM geradas com sucesso!', 'success');
          if (!document.getElementById('player-overlay').classList.contains('hidden') && Player.mode === 'read') Player.renderRead();
          else this.render();
        } catch (e) {
          showToast('Erro Gemini: ' + e.message, 'error');
        }
      },
